name: PR CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: pnpm lint
      - run: pnpm typecheck
      - name: CI helper regression tests
        run: node --test scripts/ci/pipeline.test.mjs
      - run: pnpm test
      - run: pnpm build

  windows:
    name: Windows checks and native build
    uses: ./.github/workflows/build-windows.yml
    with:
      run-checks: true
